STATE.photoCards = [];
var photoIdCounter = 0;

function handlePhotoSelect(event) {
  var files = event.target.files;
  if (!files || files.length === 0) return;

  for (var i = 0; i < files.length; i++) {
    (function(file) {
      var localId = 'photo_' + (photoIdCounter++);
      var card = { localId: localId, file: file, fileId: null, url: '', item: '', location: '', note: '', status: 'reading' };
      STATE.photoCards.push(card);
      renderPhotoCards();

      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result;
        card.previewUrl = dataUrl;
        card.status = 'uploading';
        renderPhotoCards();

        compressImage(dataUrl, function(compressedBase64, mimeType) {
          card.base64 = compressedBase64;
          card.mimeType = mimeType;

          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(function(res) {
                if (res.success) {
                  var r = res.result || {};
                  card.fileId      = r.fileId      || '';
                  card.url         = r.url         || '';
                  card.aiSummary   = r.aiSummary   || '';
                  card.aiRisk      = r.aiRisk      || '';
                  card.aiNextStep  = r.aiNextStep  || '';
                  card.status = 'done';
                } else {
                  card.status = 'error';
                  card.errorMsg = res.error;
                }
                renderPhotoCards();
              })
              .withFailureHandler(function(err) {
                card.status = 'error';
                card.errorMsg = (err && err.message) ? err.message : '連線失敗，請檢查網路';
                renderPhotoCards();
              })
              .analyzeAndSaveSitePhoto({
                base64: compressedBase64,
                mimeType: mimeType,
                fileName: file.name,
                caseName: STATE.selectedCase || '未分類',
                operator: '育瑄'
              });
          } else {
            setTimeout(function() {
              card.status = 'done';
              card.url = dataUrl;
              renderPhotoCards();
            }, 800);
          }
        });
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }

  event.target.value = '';
}

function compressImage(dataUrl, callback) {
  var img = new Image();
  img.onload = function() {
    var maxSize = 1280;
    var w = img.width, h = img.height;
    if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
    else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }

    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    var compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
    var base64 = compressedDataUrl.split(',')[1];
    callback(base64, 'image/jpeg');
  };
  img.onerror = function() {
    var base64 = dataUrl.split(',')[1];
    callback(base64, 'image/jpeg');
  };
  img.src = dataUrl;
}

function renderPhotoCards() {
  var el = document.getElementById('photoCardsList');
  if (STATE.photoCards.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = STATE.photoCards.map(function(c, idx) {
    var thumb = c.previewUrl
      ? '<img class="photo-card-thumb" src="'+c.previewUrl+'">'
      : '<div class="photo-card-thumb loading">載入中</div>';

    var statusBadge = '';
    if (c.status === 'uploading') statusBadge = '<span class="photo-card-status ps-uploading">AI 分析中...</span>';
    else if (c.status === 'done') {
      statusBadge = '<span class="photo-card-status ps-done">已上傳 + AI 分析 ✓</span>';
      if (c.aiSummary) statusBadge += '<div style="font-size:11px;color:var(--cream-faint);margin-top:4px">📝 '+esc(c.aiSummary)+'</div>';
      if (c.aiRisk && c.aiRisk !== '無') statusBadge += '<div style="font-size:11px;color:var(--rust);margin-top:2px">⚠️ '+esc(c.aiRisk)+'</div>';
    }
    else if (c.status === 'error') statusBadge = '<span class="photo-card-status ps-error">上傳失敗' + (c.errorMsg ? '：' + esc(c.errorMsg) : '') + '</span>';

    return '<div class="photo-card">'
      + thumb
      + '<div class="photo-card-fields">'
      + '<div class="photo-card-top"><span class="photo-card-label">第 '+(idx+1)+' 張</span>'
      + '<div class="photo-card-remove" onclick="removePhotoCard(\''+c.localId+'\')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div></div>'
      + '<input class="photo-card-input" placeholder="項目（例：撒水管持壓）" value="'+esc(c.item)+'" onblur="updatePhotoField(\''+c.localId+'\',\'item\',this.value)">'
      + '<div class="photo-card-row2">'
      + '<input class="photo-card-input" placeholder="位置（例：C棟-16F）" value="'+esc(c.location)+'" onblur="updatePhotoField(\''+c.localId+'\',\'location\',this.value)">'
      + '</div>'
      + '<input class="photo-card-input" placeholder="說明（例：施工中/施工完成）" value="'+esc(c.note)+'" onblur="updatePhotoField(\''+c.localId+'\',\'note\',this.value)">'
      + statusBadge
      + '</div></div>';
  }).join('');
}

function updatePhotoField(localId, field, value) {
  var card = STATE.photoCards.find(function(c){ return c.localId === localId; });
  if (card) card[field] = value;
}

function removePhotoCard(localId) {
  STATE.photoCards = STATE.photoCards.filter(function(c){ return c.localId !== localId; });
  renderPhotoCards();
}

function submitLog(push) {
  var pendingUploads = STATE.photoCards.filter(function(c){ return c.status === 'uploading' || c.status === 'reading'; });
  if (pendingUploads.length > 0) {
    showToast('還有 ' + pendingUploads.length + ' 張照片上傳中，請稍候', false);
    return;
  }

  var photosData = STATE.photoCards
    .filter(function(c){ return c.status === 'done'; })
    .map(function(c){ return { fileId: c.fileId, url: c.url, item: c.item, location: c.location, note: c.note }; });

  var data = {
    project: STATE.selectedCase,
    area: document.getElementById('logArea').value,
    today: document.getElementById('logToday').value,
    issues: document.getElementById('logIssues').value,
    crew: document.getElementById('logCrew').value,
    tomorrow: document.getElementById('logTomorrow').value,
    photos: photosData
  };

  if (typeof google !== 'undefined' && google.script) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res.success) {
          showToast('已儲存施工回報' + (res.count > 0 ? '（含'+res.count+'張照片）' : ''), true);
          STATE.photoCards = [];
          renderPhotoCards();
          if (push) afterSaveSendPush();
        } else {
          showToast('儲存失敗：' + (res.error||''), false);
        }
      })
      .withFailureHandler(function(e) { showToast('儲存失敗', false); })
      .submitSiteLogWithPhotos(data);
  } else {
    showToast('已儲存施工回報（預覽模式，含'+photosData.length+'張照片）', true);
    STATE.photoCards = [];
    renderPhotoCards();
    if (push) afterSaveSendPush();
  }
}

function afterSaveSendPush() {
  var msg = buildLogMessage();
  if (STATE.internalOn) {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.sendTelegramGroupMessage(msg);
    }
    showToast('已推播至 Telegram 內部群組', true);
  }
  if (STATE.lineOn) {
    setTimeout(function() {
      window.open('https://line.me/R/share?text=' + encodeURIComponent(msg), '_blank');
      showToast('已開啟 LINE，請選擇業主群組', true);
    }, 800);
  }
}

function previewWeekly() {
  var today = document.getElementById('logToday').value || '（依本週施工日誌彙整）';
  var tomorrow = document.getElementById('logTomorrow').value || '（依排程表自動帶入）';
  var issues = document.getElementById('logIssues').value || '無';

  var text = '【'+STATE.selectedCase+'｜本週工程進度】\n\n'
    + '✓ 已完成事項\n－ '+today+'\n\n'
    + '✓ 本週施工照片\n－ 共 0 張（自動附圖）\n\n'
    + '✓ 下週預計事項\n－ '+tomorrow+'\n\n'
    + '✓ 待確認問題\n－ '+issues+'\n\n'
    + '--------------------\n禹合制所工程管理系統 ・ 每週五 18:00 自動發送';

  var el = document.getElementById('weeklyPreviewText');
  el.textContent = text;
  el.style.display = 'block';

  var existingBtn = document.getElementById('weeklyLineBtn');
  if (!existingBtn) {
    var btn = document.createElement('button');
    btn.id = 'weeklyLineBtn';
    btn.className = 'weekly-btn';
    btn.style.marginTop = '10px';
    btn.style.color = '#06C755';
    btn.style.borderColor = 'rgba(6,199,85,.4)';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="#06C755" stroke="none"><path d="M12 2C6.48 2 2 5.92 2 10.72c0 3.1 1.86 5.84 4.68 7.47-.1.36-.65 2.3-.74 2.65 0 0-.02.1.05.14s.15.02.22-.02c.3-.16 3.82-2.52 4.37-2.88.47.07.95.1 1.42.1 5.52 0 10-3.92 10-8.72S17.52 2 12 2z"/></svg> 一鍵傳 LINE 給業主';
    btn.onclick = function() {
      window.open('https://line.me/R/share?text=' + encodeURIComponent(document.getElementById('weeklyPreviewText').textContent), '_blank');
    };
    document.querySelector('.weekly-card').appendChild(btn);
  }
}

// closeDrawingViewer（統一檔案瀏覽器關閉）
function closeDrawingViewer() {
  document.getElementById('drawingViewerModal').style.display = 'none';
  var frame = document.getElementById('drawingViewerFrame');
  if (frame) { if (frame.tagName==='IFRAME') frame.src=''; else frame.src=''; }
