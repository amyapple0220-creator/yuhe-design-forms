<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>禹合戰情室看板</title>
<style>
:root{
  --bg:#f5f6f4; --card:#ffffff; --ink:#1f2622; --sub:#6b746e; --line:#e4e7e3;
  --green:#4b6b52; --green2:#eef3ee; --amber:#c98a00; --amber2:#fff5df;
  --red:#c0392b; --red2:#fdecea; --blue:#2e6b8f; --blue2:#e9f2f7;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12140f; --card:#1c1f19; --ink:#e9ede6; --sub:#9aa39b; --line:#2c3128;
  --green:#8fb896; --green2:#20291f; --amber:#e6b93e; --amber2:#2c2612;
  --red:#e88b7f; --red2:#2e1a17; --blue:#7db8d6; --blue2:#122530;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#12140f; --card:#1c1f19; --ink:#e9ede6; --sub:#9aa39b; --line:#2c3128;
  --green:#8fb896; --green2:#20291f; --amber:#e6b93e; --amber2:#2c2612;
  --red:#e88b7f; --red2:#2e1a17; --blue:#7db8d6; --blue2:#122530;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:4px 0 8px}
header.top h1{font-size:22px;margin:0;letter-spacing:.5px}
header.top .date{color:var(--sub);font-size:14px}
.src{font-size:12.5px;color:var(--sub);margin:0 0 16px}
.src b{color:var(--green)}
.src.live b{color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12.5px;color:var(--sub);margin-bottom:4px}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:.3px}
.kpi .v small{font-size:12px;font-weight:600;color:var(--sub)}
.kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.amber .v{color:var(--amber)}
section{margin:26px 0}
section > h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
section > h2 .badge{font-size:12px;font-weight:600;color:var(--sub);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--sub);font-weight:600;background:var(--green2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;background:var(--green2)}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--green)}
.mut{color:var(--sub)}
.pos{color:var(--green);font-weight:600}.neg{color:var(--red);font-weight:700}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.t-build{background:var(--green2);color:var(--green)} .t-design{background:var(--blue2);color:var(--blue)}
.t-done{background:var(--line);color:var(--sub)} .t-designonly{background:var(--amber2);color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.pcard h3{margin:0 0 2px;font-size:15.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .stage{color:var(--sub);font-size:12.5px;margin-bottom:8px}
.pcard .next{font-size:13px;background:var(--blue2);color:var(--blue);border-radius:8px;padding:5px 9px;margin-bottom:8px}
.od .od-h{font-size:12.5px;color:var(--red);font-weight:700;margin:6px 0 4px;cursor:pointer;user-select:none}
.od .od-h .arr{display:inline-block;transition:transform .15s}
.od.open .od-h .arr{transform:rotate(90deg)}
.od .od-list{display:none}
.od.open .od-list{display:block}
.li{font-size:12.5px;padding:2px 0;display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.li .dot{flex:none;margin-top:7px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.li.done{opacity:.4;text-decoration:line-through}
.li .over-txt{color:var(--red);font-weight:600;flex:none;font-variant-numeric:tabular-nums}
.none{color:var(--sub);font-size:13px;padding:2px 0}
footer{margin-top:40px;color:var(--sub);font-size:12px;text-align:center}
.reset{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;
  padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.hint{color:var(--sub);font-size:12.5px;margin:8px 0 0}
@media(max-width:560px){
  header.top h1{font-size:19px}
  .kpi .v{font-size:19px}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>🎯 禹合戰情室</h1>
    <span class="date" id="today"></span>
    <span style="flex:1"></span>
    <button class="reset" id="reset" title="清除本機勾選">重設勾選</button>
  </header>
  <p class="src" id="srcLine">資料:讀取中…</p>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>💰 現金流總覽 <span class="badge">設計費＋工程款,單位:元</span></h2>
    <div class="card scroll"><table>
      <thead><tr>
        <th>案件</th><th>狀態</th>
        <th class="num">設計費<br>已收/總額</th>
        <th class="num">工程款<br>已收/簽約</th>
        <th class="num">待收合計</th><th>收款進度</th>
      </tr></thead>
      <tbody id="cashBody"></tbody>
    </table></div>
  </section>

  <section>
    <h2>📌 各案進度 &amp; 逾期任務 <span class="badge" id="odCount"></span></h2>
    <div class="grid" id="progGrid"></div>
    <p class="hint">⚠️ 逾期數大多是「實際做完但表上狀態沒改」——點任務可先在本機勾掉;根治要回 ERP_03_工作安排 更新狀態。</p>
  </section>

  <section>
    <h2>➡️ 未來 14 天待辦</h2>
    <div class="card scroll"><table>
      <thead><tr><th>日期</th><th>案件</th><th>待辦</th><th>負責人</th><th class="num">距今</th></tr></thead>
      <tbody id="nextBody"></tbody>
    </table></div>
  </section>

  <footer>禹合制所 YUHE DESIGN｜戰情室看板 v2</footer>
</div>

/* ── CSV 解析 ── */
function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(function(c){return c.trim();}))rows.push(row); row=[]; }
    else cur+=ch;
  }
  if(cur||row.length){row.push(cur); if(row.some(function(c){return c.trim();}))rows.push(row);}
  return rows;
}
function typeOf(txt){
  if(/結案/.test(txt))return['done','已結案'];
  if(/純設計|毛胚/.test(txt))return['designonly',txt.split('／')[0]||'純設計'];
  if(/施工|開工|翻新|新成屋|中古/.test(txt))return['build','施工中'];
  return['design','設計中'];
}
function loadLive(){
  if(!LIVE.ctrl&&!LIVE.tasks)return Promise.resolve(false);
  var jobs=[];
  jobs.push(LIVE.ctrl?fetch(LIVE.ctrl).then(function(r){return r.text();}):Promise.resolve(null));
  jobs.push(LIVE.tasks?fetch(LIVE.tasks).then(function(r){return r.text();}):Promise.resolve(null));
  return Promise.all(jobs).then(function(res){
    if(res[0]){
      var rows=parseCSV(res[0]);
      var hi=rows.findIndex(function(r){return r[0]&&r[0].indexOf('案件')===0;});
      CASES=rows.slice(hi+1).filter(function(r){return r[0]&&r[0].trim();}).map(function(r){
        var tt=typeOf((r[1]||'')+(r[2]||''));
        return {name:r[0].trim(),type:tt[0],typeTxt:tt[1],status:r[2]||'',
          dTotal:num(r[3]),dRecv:num(r[4]),eTotal:num(r[6]),eRecv:num(r[7]),
          next:r[9]||'',target:r[10]||''};
      });
    }
    if(res[1]){
      var rows2=parseCSV(res[1]);
      var hj=rows2.findIndex(function(r){return r[0]&&r[0].indexOf('日期')===0;});
      TASKS=rows2.slice(hj+1).filter(function(r){return /^\d{4}\/\d{2}\/\d{2}/.test(r[0]||'')&&(r[1]||'').trim();}).map(function(r){
        return {d:r[0].trim(),case:r[1].trim(),stage:r[2]||'',item:r[3]||'',owner:r[4]||'',status:r[5]||''};
      });
      COMPANY_SNAP=null; // 活資料模式不引用舊快照彙總
    }
    return true;
  });
}

/* ── 任務歸戶 ── */
function caseTasks(name){
  var key=name.replace(/\s/g,'').replace(/A\d.*$|B\d.*$|[A-Z]-\dF.*$/,'');
  return TASKS.filter(function(t){
    var tc=t.case.replace(/\s/g,'');
    return tc.indexOf(key.slice(0,3))===0||key.indexOf(tc.slice(0,3))===0;
  });
}
function overdueOf(name){
  return caseTasks(name).filter(function(t){
    return !/完成|取消/.test(t.status)&&!store.done[tKey(t)]&&parse(t.d)<TODAY;
  }).sort(function(a,b){return parse(a.d)-parse(b.d);});
}

function render(){

  });
  var totalRecv=dRecv+eRecv,totalDue=dDue+eDue;

  var k=[
    {k:'案件數',v:CASES.length,cls:''},

  ];
  if(COMPANY_SNAP){
    var slack=totalRecv-COMPANY_SNAP.paidOut-COMPANY_SNAP.knownPayable;

  }).join('');
  $('odCount').textContent='共 '+odAll.length+' 項逾期';

  /* 現金流表 */
  var rows=CASES.map(function(c){

    var tot=c.dTotal+c.eTotal,recv=c.dRecv+c.eRecv;

    return '<tr>'+
      '<td>'+esc(c.name)+'</td>'+

      '<td><div class="bar"><i style="width:'+pct+'%"></i></div></td>'+
    '</tr>';
  });
  var dSum=0,eSum=0,dueSum=0;
  CASES.forEach(function(c){dSum+=c.dRecv;eSum+=c.eRecv;dueSum+=Math.max(0,c.dTotal-c.dRecv)+Math.max(0,c.eTotal-c.eRecv);});
  rows.push('<tr class="total"><td>合計</td><td></td><td class="num">'+fmt(dSum)+'</td><td class="num">'+fmt(eSum)+'</td><td class="num">'+fmt(dueSum)+'</td><td></td></tr>');
  $('cashBody').innerHTML=rows.join('');

  $('progGrid').innerHTML=CASES.map(function(c){

      ? '<div class="od" data-od><div class="od-h"><span class="arr">▸</span> ⚠️ 逾期任務 '+od.length+'(點開)</div><div class="od-list">'+
        od.map(function(t){
          return '<div class="li" data-k="'+esc(tKey(t))+'"><span class="dot"></span>'+

  $('progGrid').querySelectorAll('.od .od-h').forEach(function(h){
    h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});
  });
  $('progGrid').querySelectorAll('.li[data-k]').forEach(function(el){

      var k=el.dataset.k;

  }).sort(function(a,b){return parse(a.d)-parse(b.d);});
  $('nextBody').innerHTML=up.length?up.map(function(t){
    var days=dd(TODAY,parse(t.d));
    return '<tr><td class="num">'+esc(t.d)+'</td><td>'+esc(t.case)+'</td><td>'+esc(t.item)+'</td>'+
      '<td>'+esc(t.owner)+'</td><td class="num">'+(days===0?'今天':days+' 天後')+'</td></tr>';
  }).join(''):'<tr><td colspan="5" class="none">未來 14 天沒有排定任務</td></tr>';

  $('srcLine').innerHTML='資料:<b>快照 '+SNAP_DATE+'</b>(即時讀取失敗:'+esc(e.message)+')';
  render();
});
</script>
